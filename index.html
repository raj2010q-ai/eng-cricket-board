<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fees & Admissions — Academy Manager</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');
:root{
  --ink:#0F172A; --panel:#16213A; --panel-2:#1B2A47; --line: rgba(255,255,255,0.08);
  --text:#F1F5F9; --muted:#94A3B8; --muted-dim: rgba(148,163,184,0.15);
  --emerald:#10B981; --emerald-dim: rgba(16,185,129,0.16);
  --amber:#F59E0B; --amber-dim: rgba(245,158,11,0.16);
  --crimson:#EF4444; --crimson-dim: rgba(239,68,68,0.16);
}
*{box-sizing:border-box;}
html,body{margin:0; padding:0;}
.app-shell{ font-family:'Inter',sans-serif; background:var(--ink); color:var(--text); min-height:100vh; display:flex; position:relative; }

.sidebar{ width:230px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:22px 16px; position:sticky; top:0; height:100vh; }
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{font-size:22px;}
.brand-name{font-family:'Oswald',sans-serif; font-size:15px; font-weight:600;}
.brand-tag{font-size:11px; color:var(--muted);}
.lane-line{height:1px; background: repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 12px); margin:18px 0;}
.nav-list{display:flex; flex-direction:column; gap:4px; flex:1;}
.nav-item{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; border:none; background:transparent; color:var(--muted); font-size:14px; cursor:pointer; text-align:left; font-family:inherit; }
.nav-item:hover{background:var(--panel-2); color:var(--text);}
.nav-item.active{background:var(--emerald-dim); color:var(--emerald); font-weight:600;}
.sidebar-footer{padding-top:14px; border-top:1px solid var(--line);}
.role-pill{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); background:var(--panel-2); padding:6px 10px; border-radius:20px;}

.main-col{flex:1; display:flex; flex-direction:column; min-width:0;}
